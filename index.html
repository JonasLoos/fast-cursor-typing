<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fast Cursor Typer</title>
    <style>
        /* Basic Reset & Font */
        body {
            font-family: sans-serif;
            margin: 0;
            padding: 1rem;
            background-color: #f9fafb;
            color: #111827;
            display: flex;
            justify-content: center;
            align-items: flex-start; /* Align to top */
            min-height: 100vh;
        }

        * {
            box-sizing: border-box;
        }

        /* Layout Container */
        .container {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 1rem;
            padding: 1rem;
            max-width: 36rem; /* User adjusted */
            margin: 0 auto;
            user-select: none;
            width: 100%;
        }

        /* Card Base Style */
        .card {
            background-color: #fff;
            border: 1px solid #e5e7eb;
            border-radius: 0.5rem;
            width: 100%;
            box-shadow: 0 1px 3px 0 rgba(0, 0, 0, 0.1), 0 1px 2px 0 rgba(0, 0, 0, 0.06);
        }

        .card-content {
            padding: 1rem;
        }

        /* Specific Card Contents */
        .info-card-content {
            padding: 0.75rem;
            display: flex;
            gap: 0.5rem;
            font-size: 0.875rem;
            line-height: 1.25rem;
            color: #374151;
        }
        .info-card-content p {
            margin: 0; /* Remove default paragraph margin */
        }
        /* Removed Info SVG specific style - handled by .icon */

        .output-card-content {
            font-size: 1.25rem;
            font-family: monospace;
            word-break: break-words;
            min-height: 3rem;
            color: #6b7280; /* Default text color */
        }
        .output-card-content.has-content {
            color: #111827;
        }

        /* Pad Grid Layout */
        .pad-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            grid-template-rows: repeat(3, 1fr);
            gap: 0.5rem;
        }

        /* General Button Style */
        .button {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            border-radius: 0.375rem;
            padding: 0.5rem 1rem;
            font-size: 0.875rem;
            font-weight: 500;
            cursor: pointer;
            transition: background-color 0.2s, border-color 0.2s, box-shadow 0.2s;
            border: 1px solid transparent;
            height: 6rem;
            width: 6rem;
            flex-direction: column;
            gap: 0.25rem;
            font-size: 1.5rem;
            line-height: 2rem;
        }
        .button:focus {
            outline: 2px solid transparent;
            outline-offset: 2px;
            box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.5);
        }
        .button.disabled, .button:disabled {
            opacity: 0.7;
            cursor: default;
        }

        /* Button Variants */
        .button-outline {
            border: 1px solid #d1d5db;
            background-color: transparent;
            color: #374151;
        }
         .button-outline.active {
             border-width: 4px;
             /* border-color set in JS */
         }
         .button-outline.flash {
             border-width: 4px;
             /* border-color set in JS */
         }
         .button-outline .button-text {
             font-size: 0.75rem;
             line-height: 1rem;
             word-break: break-all;
             white-space: pre-wrap;
             text-align: center;
             color: #6b7280;
         }

        .button-secondary {
            background-color: #f3f4f6;
            border: 4px solid transparent; /* Base for state borders */
            color: #374151;
        }
        .button-secondary:hover {
            background-color: #e5e7eb;
        }
        .button-secondary.locked {
            border-color: #10b981; /* green-500 */
        }
        .button-secondary.soft-cap {
             border-color: #f59e0b; /* yellow-400 */
        }

        /* Grid Positioning */
        .pos-up    { grid-row-start: 1; grid-column-start: 2; }
        .pos-right { grid-row-start: 2; grid-column-start: 3; }
        .pos-down  { grid-row-start: 3; grid-column-start: 2; }
        .pos-left  { grid-row-start: 2; grid-column-start: 1; }
        .pos-center{ grid-row-start: 2; grid-column-start: 2; }

        /* Base Icon Style */
        .icon {
            width: 1.5rem;
            height: 1.5rem;
            stroke-width: 2;
            stroke: currentColor;
            fill: none;
        }

        /* Options Card Specifics */
        .options-card-content {
            padding: 1rem;
            display: flex;
            flex-direction: column;
            gap: 1rem;
            font-size: 0.875rem;
             color: #374151;
        }
        .options-card-content label {
            display: flex;
            flex-direction: column;
            gap: 0.25rem;
        }
        .options-card-content input[type="range"] {
            width: 100%;
            cursor: pointer;
        }

        /* Helper for empty state in output */
        .empty-placeholder {
            color: #9ca3af;
        }
        
        /* Options Card Header */
        .options-card-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0.75rem 1rem;
            cursor: pointer;
            border-bottom: 1px solid #e5e7eb; /* Add separator */
        }
        .options-card-header h3 {
            margin: 0;
            font-size: 1rem;
            font-weight: 500;
             color: #374151;
        }
         .options-card-header .toggle-icon {
            width: 1.25rem;
            height: 1.25rem;
            transition: transform 0.2s ease-in-out;
            stroke: #6b7280;
        }
        .options-card-content.collapsed {
            display: none;
        }
        .options-card-header.collapsed .toggle-icon {
             transform: rotate(-90deg);
        }
        
        /* Options Textarea */
        .options-card-content textarea {
            width: 100%;
            max-width: 100%;
            min-width: 100%;
            min-height: 3rem; /* Adjust as needed */
            font-family: monospace;
            border: 1px solid #d1d5db;
            border-radius: 0.375rem;
            padding: 0.5rem;
            font-size: 0.875rem;
             color: #374151;
            transition: border-color 0.2s ease-in-out; /* Smooth border transition */
        }
        .options-card-content textarea.warning {
            border-color: #f59e0b; /* yellow-400 */
            box-shadow: 0 0 0 1px #f59e0b; /* Add a subtle glow */
        }

        /* Character Set Warning Message */
        .char-set-warning {
            font-size: 0.75rem;
            color: #f59e0b; /* yellow-400 */
            margin: 0.25rem 0 0 0; /* Small top margin */
            display: none; /* Hidden by default */
        }
        .char-set-warning.visible {
            display: block;
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- INFO -->
        <div class="card">
            <div class="card-content info-card-content">
                <p>
                    Click the centre button to start, then move the mouse in three directions to select a character. Click again to exit.
                </p>
            </div>
        </div>

        <!-- OUTPUT -->
        <div class="card">
            <div id="output-display" class="card-content output-card-content">
                <span class="empty-placeholder">&lt;&lt;typed text&gt;&gt;</span>
            </div>
        </div>

        <!-- PAD -->
        <div class="pad-grid">
            <!-- Arrow Buttons -->
            <button id="btn-up" class="button button-outline pos-up" disabled>
                <!-- Up Arrow SVG -->
                <svg class="icon" xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="19" x2="12" y2="5"></line><polyline points="5 12 12 5 19 12"></polyline></svg>
                <span class="button-text" id="text-up"></span>
            </button>
            <button id="btn-right" class="button button-outline pos-right" disabled>
                <!-- Right Arrow SVG -->
                 <svg class="icon" xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="5" y1="12" x2="19" y2="12"></line><polyline points="12 5 19 12 12 19"></polyline></svg>
                <span class="button-text" id="text-right"></span>
            </button>
            <button id="btn-down" class="button button-outline pos-down" disabled>
                <!-- Down Arrow SVG -->
                 <svg class="icon" xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="5" x2="12" y2="19"></line><polyline points="19 12 12 19 5 12"></polyline></svg>
                <span class="button-text" id="text-down"></span>
            </button>
            <button id="btn-left" class="button button-outline pos-left" disabled>
                <!-- Left Arrow SVG -->
                <svg class="icon" xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="19" y1="12" x2="5" y2="12"></line><polyline points="12 19 5 12 12 5"></polyline></svg>
                <span class="button-text" id="text-left"></span>
            </button>

            <!-- Centre Button -->
            <button id="btn-centre" class="button button-secondary pos-center">
                 <!-- Crosshair SVG -->
                 <svg class="icon" xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"></circle><line x1="22" y1="12" x2="18" y2="12"></line><line x1="6" y1="12" x2="2" y2="12"></line><line x1="12" y1="6" x2="12" y2="2"></line><line x1="12" y1="22" x2="12" y2="18"></line></svg>
            </button>
        </div>

         <!-- OPTIONS -->
        <div class="card">
             <div class="options-card-header collapsed" id="options-header">
                <h3>Options</h3>
                 <!-- Chevron Down SVG -->
                <svg class="toggle-icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 20 20" fill="currentColor">
                    <path fill-rule="evenodd" d="M5.293 7.293a1 1 0 011.414 0L10 10.586l3.293-3.293a1 1 0 111.414 1.414l-4 4a1 1 0 01-1.414 0l-4-4a1 1 0 010-1.414z" clip-rule="evenodd" />
                </svg>
            </div>
            <div class="card-content options-card-content collapsed" id="options-content">
                <label>
                    <span>Sensitivity (pixels): <span id="threshold-value">25</span></span>
                    <input id="threshold-slider" type="range" min="5" max="50" step="1" value="25">
                </label>
                <label>
                    <span>Available Characters:</span>
                    <textarea id="char-set-input"></textarea>
                    <p id="char-set-warning" class="char-set-warning">Warning: Character set is not fully defined, remaining characters will be filled with '·'.</p>
                </label>
            </div>
        </div>
    </div>

    <script>
        // CONFIG
        const movesPerChar = 3;
        let rawSet =
            "abcdefghijklmnopqrstuvwxyz0123456789,.!?-@#$%&*;:'\"/()[]{}<>";
        let charSet = ''; // Will be calculated initially and on update
        const dirOrder = ["up", "right", "down", "left"];

        // STATE
        let path = [];
        let output = "";
        let locked = false;
        let softCap = false; // Pointer lock fallback mode
        let progress = { up: 0, right: 0, down: 0, left: 0 };
        let flashDir = null;
        let threshold = 25;
        let accum = { x: 0, y: 0 };
        let flashTimeout = null;

        // DOM Elements
        const centreButton = document.getElementById("btn-centre");
        const outputDisplay = document.getElementById("output-display");
        const thresholdSlider = document.getElementById("threshold-slider");
        const thresholdValue = document.getElementById("threshold-value");
        const dirButtons = {};
        const dirTexts = {};
        dirOrder.forEach(dir => {
            dirButtons[dir] = document.getElementById(`btn-${dir}`);
            dirTexts[dir] = document.getElementById(`text-${dir}`);
        });
        const emptyPlaceholderHTML = '<span class="empty-placeholder">&lt;&lt;typed text&gt;&gt;</span>';
        const optionsHeader = document.getElementById("options-header");
        const optionsContent = document.getElementById("options-content");
        const charSetInput = document.getElementById("char-set-input");
        const charSetWarning = document.getElementById("char-set-warning");

        // HELPERS
        const dirToIndex = (d) => dirOrder.indexOf(d);
        const indexForPath = (p) =>
            p.reduce((a, d, i) => a + dirToIndex(d) * 4 ** (movesPerChar - i - 1), 0);
        const groupChars = (d) => {
            const start = indexForPath([...path, d]);
            const chars = charSet.slice(start, start + 4 ** (movesPerChar - path.length - 1));
            return chars || " ";
        };

        // Calculates the full charSet based on rawSet and padding
        const calculateCharSet = () => {
            const requiredLength = 4 ** movesPerChar;
            charSet = rawSet.slice(0, requiredLength).padEnd(requiredLength, "·");
        };

        // Debounce function
        let debounceTimeout = null;
        const debounce = (func, delay) => {
            return function(...args) {
                clearTimeout(debounceTimeout);
                debounceTimeout = setTimeout(() => {
                    func.apply(this, args);
                }, delay);
            };
        };

        // UPDATE UI
        function updateUI() {
            // Update Output
            if (output) {
                outputDisplay.textContent = output;
                outputDisplay.classList.add('has-content');
            } else {
                outputDisplay.innerHTML = emptyPlaceholderHTML;
                outputDisplay.classList.remove('has-content');
            }

            // Update Direction Buttons (Style & Text)
            dirOrder.forEach((dir) => {
                const btn = dirButtons[dir];
                const textSpan = dirTexts[dir];
                if (!btn) return; // Skip if button not found

                const isActive = path.length > 0 && path[path.length - 1] === dir;
                const isFlash = flashDir === dir;
                const frac = progress[dir] || 0;

                btn.classList.toggle("active", isActive); // Note: .active class doesn't have styles currently
                btn.classList.toggle("flash", isFlash);
                // Border color adjusted based on user edits (no active blue border)
                btn.style.borderColor = isFlash ? "#10b981" : "#d1d5db";
                btn.style.borderWidth = (isFlash || isActive) ? "4px" : "1px";
                btn.style.backgroundColor = frac > 0 ? `rgba(59,130,246,${frac * 0.25})` : "transparent";

                if (textSpan) {
                    textSpan.textContent = groupChars(dir);
                }
            });

            // Update Centre Button State
            centreButton.classList.toggle("locked", locked);
            centreButton.classList.toggle("soft-cap", softCap && !locked);

            // Update Threshold Display
            thresholdValue.textContent = threshold;
        }

        // ACCEPT MOVE
        const accept = (dir) => {
            path.push(dir);
            progress = { up: 0, right: 0, down: 0, left: 0 };
            accum = {x: 0, y: 0};

            // Flash effect
            flashDir = dir;
            clearTimeout(flashTimeout);
            flashTimeout = setTimeout(() => {
                flashDir = null;
                updateUI();
            }, 200);

            if (path.length === movesPerChar) {
                const ch = charSet[indexForPath(path)];
                if (ch !== '·') { // Don't add padding char
                  output += ch;
                }
                path = [];
            }
            updateUI();
        };

        // KEYBOARD INPUT
        const onKey = (e) => {
            if (e.code === "Escape") {
                if (locked || softCap) {
                   stopCapture();
                }
            }
        };

        // POINTER LOCK CONTROL
        const startCapture = () => {
            if (locked || softCap) return;
            if (!centreButton) return;
            softCap = false;
            // Use body for pointer lock request for broader capture area
            if (document.body.requestPointerLock) {
                document.body.requestPointerLock();
            } else {
                console.warn("Pointer Lock API not fully supported. Using soft capture.");
                softCap = true; // Fallback
                updateUI();
            }
        };

        const stopCapture = () => {
            if (document.pointerLockElement === document.body) {
                 document.exitPointerLock();
            }
            // Reset states regardless of lock status on explicit stop
            locked = false;
            softCap = false;
            path = [];
            progress = { up: 0, right: 0, down: 0, left: 0 };
            accum = { x: 0, y: 0 };
            updateUI();
        };

        // Pointer lock event handlers
        const onLockChange = () => {
            const isActive = document.pointerLockElement === document.body;
            if (isActive) {
                locked = true;
                softCap = false;
                // Clear state on successful lock
                path = [];
                progress = { up: 0, right: 0, down: 0, left: 0 };
                accum = { x: 0, y: 0 };
            } else {
                // If lock was active and is now inactive, ensure cleanup
                if (locked) {
                   stopCapture(); // Resets state and updates UI
                   return; // Avoid double UI update
                }
            }
            updateUI();
        };

        const onLockError = (e) => {
            console.error("Pointer lock failed: ", e);
            locked = false;
            softCap = true; // Attempt soft capture as fallback
            updateUI();
        };

        // Global click handler (for exiting capture)
         const onMouseDown = (e) => {
            // If centre button clicked, let its handler manage capture start
            if (centreButton && centreButton.contains(e.target)) return;
            // If anywhere else is clicked while active, stop capture
            if (locked || softCap) {
                stopCapture();
            }
        };

        // MOUSE MOVEMENT
        const onMove = (e) => {
            if (!locked && !softCap) return;

            accum.x += e.movementX;
            accum.y += e.movementY;
            const { x, y } = accum;
            const absX = Math.abs(x);
            const absY = Math.abs(y);

            if (absX === 0 && absY === 0) return; // No change

            // Determine direction and delta
            let dir;
            let delta;
            if (absX > absY) {
                dir = x > 0 ? "right" : "left";
                delta = absX;
            } else {
                dir = y > 0 ? "down" : "up";
                delta = absY;
            }

            const frac = Math.min(delta / threshold, 1);

            // Update progress only for the dominant direction
            progress = { up: 0, right: 0, down: 0, left: 0, [dir]: frac };

            if (delta >= threshold) {
                accept(dir);
            } else {
                updateUI(); // Update progress visualization
            }
        };

        // INITIALIZATION
        function init() {
             // Add Event Listeners
            document.addEventListener("pointerlockchange", onLockChange);
            document.addEventListener("pointerlockerror", onLockError);
            document.addEventListener("mousedown", onMouseDown);
            window.addEventListener("keydown", onKey);
            window.addEventListener("mousemove", onMove);

            centreButton.addEventListener("mousedown", (e) => {
                e.stopPropagation();
                startCapture();
            });

            thresholdSlider.addEventListener("input", (e) => {
                threshold = Number(e.target.value);
                updateUI(); // Update threshold display immediately
            });

            // Options Toggle
            optionsHeader.addEventListener("click", () => {
                 optionsHeader.classList.toggle("collapsed");
                 optionsContent.classList.toggle("collapsed");
            });

            // Function to check character set length and update warning
            const checkCharSetLength = (currentValue) => {
                const requiredLength = 4 ** movesPerChar;
                const isShort = currentValue.length < requiredLength;
                charSetInput.classList.toggle("warning", isShort);
                charSetWarning.classList.toggle("visible", isShort);
            };

            // Auto-update Character Set on Input (debounced)
            const updateCharSetFromInput = debounce(() => {
                let newRawSet = charSetInput.value;
                const requiredLength = 4 ** movesPerChar;

                // Truncate if exceeds limit
                if (newRawSet.length > requiredLength) {
                    newRawSet = newRawSet.slice(0, requiredLength);
                    charSetInput.value = newRawSet; // Update textarea visually
                }

                checkCharSetLength(newRawSet); // Update warning state

                if (newRawSet !== rawSet) {
                    rawSet = newRawSet;
                    calculateCharSet(); // Recalculate the padded set
                    updateUI(); // Update button texts etc.
                }
            }, 100); // 100ms delay

            charSetInput.addEventListener("input", updateCharSetFromInput);

            // Initial UI Setup
            charSetInput.value = rawSet; // Populate textarea
            checkCharSetLength(rawSet); // Initial check for warning
            calculateCharSet(); // Calculate initial padded charSet
            updateUI();
        }

        // Run init when the DOM is ready
        document.addEventListener('DOMContentLoaded', init);

    </script>
</body>
</html>
